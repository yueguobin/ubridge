name: Compile uBridge

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    name: build [${{ matrix.runner }}]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Compile
        run: make

      - name: Verify build
        run: ./ubridge -v
